<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management</title>
  </head>
  <body>
    <script>
      const inventory = [
        {
          name: "castle lite",
          quantity: 13,
        },
        {
          name: "desperados",
          quantity: 8,
        },
        {
          name: "fearless",
          quantity: 20,
        },
      ];

      function findProductIndex(prodName) {
        for (let i = 0; i < inventory.length; i++) {
          if (prodName.toLowerCase() === inventory[i].name.toLowerCase()) {
            return inventory.indexOf(inventory[i]);
          }
        }
        return -1;
      }

      function addProduct(prodObject) {
        let prodIndex = findProductIndex(prodObject.name);
        if (prodIndex >= 0) {
          inventory[prodIndex].quantity = prodObject.quantity;
          console.log(`${prodObject.name} ${prodObject.quantity}`);
        } else {
          inventory.push(prodObject.toLowerCase());
          console.log(`${prodObject.name} added to inventory`);
        }
      }

      function removeProduct(prodName, prodQuantity) {
        const prodIndex = findProductIndex(prodName);
        let quantity = inventory[prodIndex].quantity;

        if (quantity > prodQuantity) {
          quantity = quantity - prodQuantity;
          console.log(`Remaining ${prodName} pieces: ${quantity}`);
        }

        if (quantity < 1) {
          inventory.splice(prodIndex, 1);
        } else if (quantity < prodQuantity) {
          console.log(
            `Not enough ${prodName} available, remaining pieces: ${quantity}`
          );
        } else if (!inventory.includes(inventory[prodIndex])) {
          console.log(`${prodName} not found`);
        }
      }

      console.log(removeProduct("castle lite", 12));
      console.log(inventory);
    </script>
  </body>
</html>
